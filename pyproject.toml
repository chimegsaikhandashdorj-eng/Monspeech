[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM"]
ignore = [
    "E501",  # Монгол тайлбар комментууд урт байдаг тул E501-г зөвшөөрнө
    "SIM105", # try-except-pass зарим газар зориудын
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
